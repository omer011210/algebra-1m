<style>
/* Layout: one study card centered on graph paper. The theorem is a sentence of chunks; at each stage more chunks go blank and you fill them from a word bank. */
:root{
  --bg:#f6f4fa; --grid:#e7e2f0; --ink:#1f1b2b; --muted:#666077; --card:#ffffff; --slot:#f1edf7;
  --hl:#e0338f; --hl-soft:#fde3f0; --ok:#12866f; --ok-soft:#d9f3ec; --bad:#c2313f; --bad-soft:#fbe1e4; --amber:#a35d00; --amber-soft:#fff1d9;
  --f-ui:"Rubik", "Segoe UI", Arial, sans-serif; --f-math:"Frank Ruhl Libre", Georgia, serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14111c; --grid:#211c2c; --ink:#efeaf7; --muted:#a9a2ba; --card:#1f1a2b; --slot:#2a2438;
  --hl:#ff6db3; --hl-soft:#40192f; --ok:#5fd3bc; --ok-soft:#123630; --bad:#ff7c88; --bad-soft:#3d1a20; --amber:#ffbf5e; --amber-soft:#3a2a10; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14111c; --grid:#211c2c; --ink:#efeaf7; --muted:#a9a2ba; --card:#1f1a2b; --slot:#2a2438;
  --hl:#ff6db3; --hl-soft:#40192f; --ok:#5fd3bc; --ok-soft:#123630; --bad:#ff7c88; --bad-soft:#3d1a20; --amber:#ffbf5e; --amber-soft:#3a2a10; color-scheme:dark }
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  color:var(--ink);font-family:var(--f-ui);direction:rtl;font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-weight:800;font-size:clamp(1.5rem,4vw,2rem)}
h1 span{background:linear-gradient(transparent 55%, var(--hl-soft) 55%);padding:0 4px}
.hud{display:flex;gap:16px;font-weight:700;font-variant-numeric:tabular-nums}
.hud small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.hud .s{color:var(--hl)}
.panel{background:var(--card);border:1px solid var(--grid);border-radius:16px;padding:18px 20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--grid);background:var(--bg);color:var(--ink)}
label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.btn{font:inherit;border:0;background:var(--hl);color:#fff;font-weight:700;padding:9px 18px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--grid)}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)}
.btn:focus-visible,.chipb:focus-visible,select:focus-visible,.tile:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.muted{color:var(--muted)}
/* stage ladder */
.ladder{display:flex;gap:4px;margin:2px 0 12px}
.ladder i{flex:1;height:7px;border-radius:99px;background:var(--grid)}
.ladder i.on{background:var(--hl)} .ladder i.cur{background:var(--hl);opacity:.45}
.stage{font-size:12.5px;font-weight:700;color:var(--hl);letter-spacing:.03em}
.tname{font-size:clamp(1.25rem,3.4vw,1.65rem);font-weight:800;margin:4px 0 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px}
.tag.rep{background:var(--hl);color:#fff} .tag.add{background:var(--ok-soft);color:var(--ok)} .tag.heavy{background:var(--amber-soft);color:var(--amber)}
/* sentence */
.sent{font-family:var(--f-math);font-size:19px;line-height:2.3;padding:14px 16px;border-radius:12px;background:var(--bg);border:1px dashed var(--grid)}
.ch{display:inline;padding:2px 3px;border-radius:6px}
.ch.key{background:linear-gradient(transparent 60%, var(--hl-soft) 60%)}
.ch.blank{display:inline-block;min-width:74px;min-height:1.6em;vertical-align:middle;background:var(--slot);border:2px dashed var(--muted);line-height:1.5;text-align:center}
.ch.blank.next{border-color:var(--hl);border-style:solid;box-shadow:0 0 0 3px var(--hl-soft)}
.ch.filled{background:var(--ok-soft);animation:pop .25s}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chipb{font-family:var(--f-math);font-size:16px;border:2px solid var(--grid);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:10px;cursor:pointer;position:relative;max-width:100%}
.chipb .k{position:absolute;top:-8px;left:-6px;font-family:var(--f-ui);font-size:10px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 4px}
.chipb.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.chipb[disabled]{opacity:.25;cursor:default}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.explain{margin-top:12px;padding:10px 12px;background:var(--amber-soft);border-radius:8px;font-size:15px}
.explain b{color:var(--amber)}
textarea{width:100%;min-height:90px;font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--grid);background:var(--bg);color:var(--ink);resize:vertical}
.msg{font-weight:700} .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
/* mastery board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:12px}
.tile{font:inherit;text-align:right;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--grid);background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.tile span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--grid)}
.dots i.on{background:var(--hl)}
.dots.m i.on{background:var(--ok)}
.prog{height:10px;border-radius:99px;background:var(--grid);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok)}
.how{font-size:14.5px;color:var(--muted);margin:6px 0 0;padding-inline-start:1.2em}
.how li{margin:2px 0}
mjx-container{direction:ltr}
@media (prefers-reduced-motion: reduce){.ch.filled,.chipb.wrong{animation:none}}
</style>

 {id:'inv',t:'calc',n:'הפיכה',rep:3,c:[R`\(a_n\to\infty\Rightarrow\frac1{a_n}\to0\)`,R`~ואם`,R`\(a_n>0\)`,R`ו-\(a_n\to0\)`,R`אז \(\frac1{a_n}\to\infty\)`],d:[R`\(a_n\ne0\)`]},

 {id:'mono',t:'mono',n:'מונוטונית וחסומה מתכנסת',rep:10,c:[R`~סדרה`,R`מונוטונית עולה`,R`וחסומה מלעיל`,R`מתכנסת`,R`ל-sup שלה`],d:[R`וחסומה מלרע`,R`ל-inf שלה`,R`מתכנסת ל-\(a_1\)`],

  ex:R`ג״ח: אינסוף איברים <i>בתוך</i> כל סביבה. גבול: רק מספר סופי <i>מחוץ</i> לכל סביבה. בכיוון ⇐ בונים תת-סדרה עם \(\varepsilon_k=\frac1k\) ואינדקס גדול מהקודם.`},
 {id:'bw',t:'sub',n:'בולצאנו-ויירשטראס',rep:12,c:[R`~לכל סדרה`,R`חסומה`,R`קיימת תת-סדרה`,R`מתכנסת`],d:[R`חסומה מלעיל`,R`היא מתכנסת`],
  ex:R`זה המנוע של הוכחות בשלילה: אינסוף איברים "רעים" ⇐ BW נותן מהם תת-סדרה מתכנסת ⇐ הגבול שלה סותר משהו. הוכחה דרך "מרתפים": לכל סדרה יש תת-סדרה מונוטונית.`},

 {id:'lseq',t:'sub',n:'מתכנסת ⇔ limsup=liminf',rep:4,c:[R`~סדרה`,R`חסומה`,R`מתכנסת`,R`\(\iff\)`,R`\(\limsup a_n=\liminf a_n\)`],d:[R`\(\Rightarrow\)`,R`\(\sup a_n=\inf a_n\)`]},

 {id:'inner',t:'topo',n:'נקודה פנימית',add:1,c:[R`~\(x_0\in I\) נקודה פנימית אם`,R`קיים \(\varepsilon>0\)`,R`כך ש-\((x_0-\varepsilon,x_0+\varepsilon)\subseteq I\)`],d:[R`לכל \(\varepsilon>0\)`]},

  ex:R`חוצים: אם אין תת-כיסוי סופי, גם לאחד החצאים אין. לפי קנטור מקבלים נקודה c, וקטע פתוח אחד שמכסה את c מכסה את כל הקטעים הקטנים, סתירה. \((0,1)\) עם \((\frac1n,1)\) מראה שחייבים קטע סגור.`},

 {id:'a0',t:'pow',n:'בסיס ששואף לאפס',add:1,c:[R`~אם`,R`\(a_n>0,\ a_n\to0\)`,R`ו-\(b_n\to b>0\)`,R`אז \(a_n^{b_n}\to0\)`],d:[R`ו-\(b_n\to0\)`]},
];
const STAGES = ['קריאה','השלמה קלה','השלמה קשה','בונים מאפס','מהזיכרון'];
const PASS_LEVEL = 5;   // mastered = passed all 5 stages

const $ = s => document.querySelector(s);
const view = $('#view'), hud = $('#hud');
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const strip = c => c.startsWith('~') ? c.slice(1) : c;
const glue = c => c.startsWith('~');
const tags = t => (t.rep?`<span class="tag rep">חוזר ×${t.rep}</span>`:'') + (t.add?`<span class="tag add">מהדף שלך</span>`:'') + (t.ex?`<span class="tag heavy">כבד</span>`:'');
function typeset(el){ const go = () => MathJax.typesetPromise([el]).catch(()=>{}); if (window.MathJax && MathJax.typesetPromise) return go(); setTimeout(()=>typeset(el), 120); }

let lv = store.get('mem-level', {});
let xp = store.get('mem-xp', 0), streak = 0;
function save(){ store.set('mem-level', lv); store.set('mem-xp', xp); }
function mastered(){ return T.filter(t => (lv[t.id]||0) >= PASS_LEVEL).length; }
function drawHud(){ hud.innerHTML = `<div><small>שולט</small>${mastered()}/${T.length}</div><div><small>XP</small>${xp}</div><div class="s"><small>רצף</small>${streak}</div>`; }
function pool(v){
  if (v==='all') return T;
  if (v==='rep') return T.filter(t => (t.rep||0) >= 5);
  if (v==='heavy') return T.filter(t => t.ex);
  if (v==='weak') return T.filter(t => (lv[t.id]||0) < PASS_LEVEL);
  return T.filter(t => t.t===v);
}

/* ================= HOME ================= */
function home(){
  const topic = store.get('mem-topic','rep');
  const pct = Math.round(100*mastered()/T.length);
  view.innerHTML = `<div class="panel">
    <div class="bar">
      <label for="topic">מה לשנן
        <select id="topic">
          <option value="rep">מה שחוזר הכי הרבה בבחנים</option><option value="weak">רק מה שעוד לא שולט בו</option>
          <option value="heavy">המשפטים הכבדים</option><option value="all">הכול</option>
          <option value="basic">יסודות ו-sup</option><option value="lim">גבולות</option><option value="calc">כלי חישוב</option>
          <option value="mono">מונוטוניות וקנטור</option><option value="sub">תתי-סדרות ו-BW</option><option value="cauchy">קושי</option>
          <option value="topo">טופולוגיה</option><option value="pow">חזקות ממשיות</option>
        </select></label>
      <label for="setsize">משפטים בסט
        <select id="setsize"><option>3</option><option selected>5</option><option>8</option></select></label>
      <button class="btn" id="start">התחל סט</button>
    </div>
    <ol class="how">
      <li>קוראים את המשפט ומשננים. החלקים המודגשים הם מה שהבודקים מחפשים.</li>
      <li>חלקים מהמשפט נעלמים, ומשלימים אותם מהמחסן. במחסן יש גם מלכודות: כמתים הפוכים, \(\lt\) במקום \(\le\), תנאי חסר.</li>
      <li>בכל שלב נעלם יותר, עד שבונים את כל המשפט מאפס, ובסוף כותבים אותו מהזיכרון.</li>
      <li>המשפטים בסט מתחלפים ביניהם, כדי שתצטרך לשלוף מהזיכרון ולא רק לחזור על מה שראית שנייה קודם. יותר מטעות אחת מחזירה אותך שלב אחורה.</li>
    </ol>
    <div class="prog" title="${pct}%"><i style="width:${pct}%"></i></div>
    <div class="board" id="board">${T.map(t=>{ const l=Math.min(lv[t.id]||0,PASS_LEVEL); return `<button class="tile" data-id="${t.id}" title="תרגל רק את המשפט הזה"><span>${t.n}</span><span class="dots ${l>=PASS_LEVEL?'m':''}">${Array.from({length:PASS_LEVEL},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</span></button>`; }).join('')}</div>
    <div class="foot"><span class="muted" style="font-size:13px">ההתקדמות נשמרת בדפדפן הזה.</span><button class="btn ghost" id="reset">אפס התקדמות</button></div>
  </div>`;
  $('#topic').value = topic;
  $('#topic').onchange = e => store.set('mem-topic', e.target.value);
  $('#start').onclick = () => {
    const p = pool($('#topic').value);
    const n = +$('#setsize').value;
    const pick = shuffle(p).sort((a,b)=>(lv[a.id]||0)-(lv[b.id]||0)).slice(0, n);
    if (!pick.length) { $('#start').textContent = 'כל המשפטים כאן כבר בשליטה'; return; }
    startSet(pick);
  };
  view.querySelectorAll('.tile').forEach(b => b.onclick = () => startSet([T.find(t=>t.id===b.dataset.id)], true));
  let armed = false;
  $('#reset').onclick = e => { if (!armed){ armed = true; e.target.textContent = 'לחץ שוב לאישור'; return; } lv = {}; xp = 0; save(); home(); };
  typeset(view); drawHud();
}

/* ================= SET / QUEUE ================= */
let Q = null;
function startSet(list, fromScratch){
  Q = { items: list.map(t => ({ t, stage: fromScratch ? 0 : Math.min(lv[t.id]||0, 4) })), done:[], gained:0 };
  next();
}
function next(){
  if (!Q.items.length) return finish();
  const it = Q.items.shift();
  (it.stage === 4 ? recall : it.stage === 0 ? read : cloze)(it);
}
function advance(it, ok){
  if (ok){
    lv[it.t.id] = Math.max(lv[it.t.id]||0, it.stage+1);
    it.stage++;
    xp += 25; Q.gained += 25;
    if (it.stage >= PASS_LEVEL) Q.done.push(it.t); else Q.items.push(it);
  } else {
    it.stage = Math.max(1, it.stage-1);
    Q.items.splice(Math.min(1, Q.items.length), 0, it);   // comes back right after the next theorem
  }
  save(); drawHud(); next();
}
function ladder(stage){ return `<div class="ladder">${STAGES.map((_,i)=>`<i class="${i<stage?'on':i===stage?'cur':''}"></i>`).join('')}</div>`; }
function header(it){ return `<div class="stage">שלב ${it.stage+1} מתוך 5 · ${STAGES[it.stage]} · נשארו ${Q.items.length+1} בתור</div>${ladder(it.stage)}<div class="tname">${it.t.n} ${tags(it.t)}</div>`; }

/* stage 0: read */
function read(it){
  const keyIdx = blankable(it.t);
  view.innerHTML = `<div class="panel">${header(it)}
    <div class="sent">${it.t.c.map((c,i)=>`<span class="ch ${keyIdx.includes(i)?'key':''}">${strip(c)}</span>`).join(' ')}</div>
    ${it.t.ex?`<div class="explain"><b>למה זה עובד: </b>${it.t.ex}</div>`:''}
    <p class="muted" style="margin:12px 0 0">קרא בקול פעמיים. בשלב הבא חלקים יתחילו להיעלם.</p>
    <div class="foot"><button class="btn ghost" id="quit">חזרה לרשימה</button><button class="btn" id="go">שיננתי, תבחן אותי</button></div></div>`;
  $('#go').onclick = () => advance(it, true);
  $('#quit').onclick = home;
  $('#go').focus();
  typeset(view);
}

/* stages 1-3: cloze from a word bank with traps */
function blankable(t){ return t.c.map((c,i)=>glue(c)?-1:i).filter(i=>i>=0); }
function cloze(it){
  const t = it.t, idx = blankable(t);
  const frac = it.stage===1 ? .4 : it.stage===2 ? .75 : 1;
  const k = Math.max(1, Math.round(idx.length*frac));
  // stage 1-2: blank the "trap" chunks first, because those are what graders check
  const trapFirst = idx.slice().sort((a,b)=> (trapScore(t,b)-trapScore(t,a)) || (Math.random()-.5));
  const blanks = (it.stage===3 ? idx : trapFirst.slice(0,k)).sort((a,b)=>a-b);
  const others = shuffle(T.filter(x=>x.id!==t.id && x.t===t.t).flatMap(x=>x.c.filter(c=>!glue(c)))).slice(0, it.stage===3?1:2);
  const traps = (t.d||[]).slice(0, it.stage===1 ? 2 : 4);
  const bankItems = shuffle([...blanks.map(i=>({txt:t.c[i], real:true})), ...traps.map(x=>({txt:x})), ...others.map(x=>({txt:x}))]);
  const S = { pos:0, miss:0, blanks };
  view.innerHTML = `<div class="panel">${header(it)}
    <div class="sent" id="sent">${t.c.map((c,i)=> blanks.includes(i) ? `<span class="ch blank" data-i="${i}"></span>` : `<span class="ch">${strip(c)}</span>`).join(' ')}</div>
    <div class="bank" id="bank">${bankItems.map((b,j)=>`<button class="chipb" data-j="${j}">${j<9?`<span class="k">${j+1}</span>`:''}${strip(b.txt)}</button>`).join('')}</div>
    <div class="foot"><span class="msg" id="msg">בחר את החלק שמתאים למשבצת המסומנת. טעויות: 0</span><button class="btn ghost" id="quit">חזרה לרשימה</button></div></div>`;
  const mark = () => { view.querySelectorAll('.ch.blank').forEach(el=>el.classList.toggle('next', +el.dataset.i===S.blanks[S.pos])); };
  mark();
  const pick = j => {
    const btn = view.querySelector(`.chipb[data-j="${j}"]`);
    if (!btn || btn.disabled || S.pos>=S.blanks.length) return;
    const want = t.c[S.blanks[S.pos]];
    if (bankItems[j].txt === want){
      const slot = view.querySelector(`.ch.blank[data-i="${S.blanks[S.pos]}"]`);
      slot.className = 'ch filled'; slot.innerHTML = strip(want); typeset(slot);
      btn.disabled = true; S.pos++; streak++; xp += 10; Q.gained += 10; drawHud(); mark();
      if (S.pos === S.blanks.length) return done();
    } else {
      S.miss++; streak = 0; drawHud();
      btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
      $('#msg').className = 'msg bad'; $('#msg').textContent = `לא זה. טעויות: ${S.miss}`;
    }
  };
  const done = () => {
    const ok = S.miss <= 1;
    $('#msg').className = 'msg ' + (ok?'ok':'bad');
    $('#msg').innerHTML = ok ? (S.miss ? 'עברת עם טעות אחת.' : 'בלי טעויות.') : `${S.miss} טעויות. חוזרים שלב אחורה.`;
    const f = view.querySelector('.foot');
    f.insertAdjacentHTML('beforeend', `<button class="btn" id="cont">המשך</button>`);
    if (!ok && t.ex) view.querySelector('.panel').insertAdjacentHTML('beforeend', `<div class="explain"><b>למה זה עובד: </b>${t.ex}</div>`);
    $('#cont').onclick = () => advance(it, ok); $('#cont').focus();
    typeset(view);
  };
  view.querySelectorAll('.chipb').forEach(b => b.onclick = () => pick(+b.dataset.j));
  $('#quit').onclick = home;
  keyHandler = e => { if (/^Digit[1-9]$/.test(e.code)) pick(+e.code.slice(5)-1); };
  typeset(view);
}
function trapScore(t, i){
  // a chunk that has a trap variant in d (shares symbols such as ∀/∃, <, ≤) is weighted higher
  const c = t.c[i]; const d = t.d||[];
  return d.some(x => { const a = x.replace(/[^\\a-zA-Z<>=≤≥]/g,''), b = c.replace(/[^\\a-zA-Z<>=≤≥]/g,''); return a.slice(0,8)===b.slice(0,8) || x.split(' ')[0]===c.split(' ')[0]; }) ? 1 : 0;
}

/* stage 4: full recall */
function recall(it){
  view.innerHTML = `<div class="panel">${header(it)}
    <p>נסח את המשפט <b>מילה במילה</b>, כולל כל התנאים. כתוב כאן, על דף, או אמור בקול.</p>
    <textarea id="draft" placeholder="כתוב את הניסוח שלך..."></textarea>
    <div id="ans" hidden><div class="sent" style="margin-top:12px">${it.t.c.map(c=>`<span class="ch">${strip(c)}</span>`).join(' ')}</div>
      <p class="muted" style="margin:10px 0 0">השווה בכנות: כמת הפוך, \(\lt\) במקום \(\le\) או תנאי חסר נחשבים טעות, כי בבוחן זה מוריד את כל הסעיף.</p></div>
    <div class="foot" id="f"><button class="btn ghost" id="quit">חזרה לרשימה</button><button class="btn" id="rev">חשוף</button></div></div>`;
  $('#quit').onclick = home;
  $('#rev').onclick = () => {
    $('#ans').hidden = false;
    $('#f').innerHTML = `<button class="btn bad" id="no">פספסתי משהו</button><button class="btn ok" id="yes">ידעתי מדויק</button>`;
    $('#yes').onclick = () => { streak++; advance(it, true); };
    $('#no').onclick = () => { streak = 0; advance(it, false); };
    typeset(view);
  };
  $('#draft').focus();
  typeset(view);
}

/* finish */
function finish(){
  view.innerHTML = `<div class="panel" style="text-align:center">
    <div style="font-size:42px;font-weight:800">+${Q.gained} XP</div>
    <p>שיננת עד הסוף: <b>${Q.done.map(t=>t.n).join(' · ') || '—'}</b></p>
    <p class="muted">שולט ב-${mastered()} מתוך ${T.length} משפטים. כדאי לחזור על הסט הזה מחר: שליפה אחרי לילה מקבעת הרבה יותר מעוד סיבוב עכשיו.</p>
    <div class="foot" style="justify-content:center"><button class="btn" id="more">סט נוסף</button><button class="btn ghost" id="back">לרשימה</button></div></div>`;
  $('#more').onclick = () => { const p = pool(store.get('mem-topic','rep')).filter(t=>(lv[t.id]||0)<PASS_LEVEL); startSet(shuffle(p).sort((a,b)=>(lv[a.id]||0)-(lv[b.id]||0)).slice(0,5)); };
  $('#back').onclick = home;
}

let keyHandler = null;
document.addEventListener('keydown', e => { if (keyHandler && document.activeElement?.tagName !== 'TEXTAREA') keyHandler(e); });
const _next = next; next = function(){ keyHandler = null; _next(); };
drawHud(); home();
</script>
